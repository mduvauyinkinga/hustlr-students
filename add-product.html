<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Product - HUSTLR</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Add a product to your store on HUSTLR.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="my-store.css">
  <link rel="stylesheet" href="add-product.css">
  <link rel="icon" href="assets/hustlr-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/hustlr-logo.png">
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="brand">
      <picture>
        <source type="image/webp" srcset="assets/hustlr-logo.png">
        <img class="brand-logo" src="assets/hustlr-logo.png" width="34" height="34" alt="Hustlr logo" loading="eager">
      </picture>
      <h1>HUSTLR</h1>
    </div>

    <div>
      <a href="index.html">Home</a>
      <a href="discover.html">Discover</a>
      <a href="browse-stores.html">Browse Stores</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="sellerNavLinks" style="display:none;"></span>
      <a href="create-store.html" id="becomeSellerLink" style="display:none;">Become a Seller</a>
      <a href="safety.html">Safety</a>
      <a href="auth.html" id="authLink">Login</a>
    </div>
  </nav>

  <!-- LOADING STATE -->
  <section class="container add-product-container" id="loadingState">
    <div class="loading-spinner">
      <div class="spinner-icon"></div>
      <p class="loading-text">Loading...</p>
    </div>
  </section>

  <!-- ADD PRODUCT CONTENT (hidden until loaded) -->
  <section class="container add-product-container" id="addProductContent" style="display:none;">

    <h2 id="formTitle">Add Product</h2>
    <p class="subtitle" id="formSubtitle">Add a new product to your store.</p>

    <div class="add-product-card">
      <form id="addProductForm" novalidate>

        <!-- Product Image Upload -->
        <div class="form-group">
          <label>Product Image</label>
          <div class="upload-area" id="imageUploadArea">
            <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
            <img id="imagePreview" src="" alt="Product image preview" style="display:none;">
            <span class="upload-icon" id="imageUploadIcon">📷</span>
            <span class="upload-text" id="imageUploadText">Click to upload image</span>
            <span class="upload-hint">JPG, PNG or WEBP (max 5MB)</span>
            <div class="upload-spinner" id="imageUploadSpinner" style="display:none;"></div>
          </div>
        </div>

        <!-- Product Name -->
        <div class="form-group">
          <label for="productName">Product Name <span style="color:#b1123a;">*</span></label>
          <input
            type="text"
            id="productName"
            placeholder="e.g. Classic Burger"
            required
          />
        </div>

        <!-- Category -->
        <div class="form-group">
          <label for="category">Category <span style="color:#b1123a;">*</span></label>
          <select id="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Meals">Meals</option>
            <option value="Drinks">Drinks</option>
            <option value="Snacks">Snacks</option>
            <option value="Services">Services</option>
            <option value="Repairs">Repairs</option>
            <option value="Clothing">Clothing</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            placeholder="Describe your product..."
          ></textarea>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label for="price">Price (R) <span style="color:#b1123a;">*</span></label>
          <input
            type="number"
            id="price"
            placeholder="0.00"
            min="0"
            step="0.50"
            required
          />
        </div>

        <!-- Available Toggle -->
        <div class="form-group">
          <label>Availability</label>
          <div style="background:#0f0f10; border-radius:8px; padding:0 14px; border:1px solid #2a2a2e;">
            <div class="toggle-row">
              <span class="toggle-label">Product Available</span>
              <label class="toggle-switch">
                <input type="checkbox" id="available" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="saveBtn"
          class="save-btn"
          disabled
        >
          Save Product
        </button>

      </form>

      <!-- Status Message -->
      <p id="addProductStatus" class="add-product-status"></p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 HUSTLR. Built for students by KTM Tech. All rights reserved.
  </footer>

  <script type="module" src="add-product.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
