<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover products and stores on HUSTLR - the student-powered campus marketplace.">
  <title>Discover - HUSTLR</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="browse-stores.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="discover.css">
  <link rel="stylesheet" href="reviews.css">
  <link rel="icon" href="assets/hustlr-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/hustlr-logo.png">
  <meta name="theme-color" content="#b1123a">
</head>
<body>

  <!-- NAV -->
  <nav class="nav-mobile-toggle">
    <div class="brand">
      <picture>
        <source type="image/webp" srcset="assets/hustlr-logo.png">
        <img class="brand-logo" src="assets/hustlr-logo.png" width="34" height="34" alt="Hustlr logo" loading="eager">
      </picture>
      <h1>HUSTLR</h1>
    </div>

    <!-- Hamburger button — visible on mobile only; toggles the .nav-links menu below -->
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="discover.html">Discover</a>
      <a href="browse-stores.html">Browse Stores</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="sellerNavLinks" style="display:none;"></span>
      <a href="create-store.html" id="becomeSellerLink" style="display:none;">Become a Seller</a>
      <a href="safety.html">Safety</a>
      <a href="auth.html" id="authLink">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="discover-hero">
    <h2>Discover HUSTLR</h2>
    <p>Search products, stores and categories from trusted student hustlers around campus.</p>
  </section>

  <!-- TOOLBAR -->
  <section class="container discover-toolbar">

    <!-- Tabs -->
    <div class="discover-tabs" id="discoverTabs">
      <button class="discover-tab-btn active" data-tab="products">Products <span class="tab-count" id="productTabCount"></span></button>
      <button class="discover-tab-btn" data-tab="stores">Stores <span class="tab-count" id="storeTabCount"></span></button>
    </div>

    <!-- Search -->
    <div class="search-wrapper full-width">
      <input
        type="text"
        id="discoverSearchInput"
        class="search-input"
        placeholder="Search products, stores, categories..."
        autocomplete="off"
      />
      <span class="search-icon">&#x1F50D;</span>
    </div>

    <!-- Category filter -->
    <div class="filter-row">
      <div class="category-filters" id="discoverCategoryFilters">
        <button class="category-btn active" data-category="all">All</button>
      </div>
    </div>

    <!-- Toggle chips + sort -->
    <div class="filter-row">
      <button class="filter-chip" id="openNowChip" data-filter="openNow">Open Now</button>
      <button class="filter-chip" id="deliveryChip" data-filter="delivery">Delivery</button>
      <button class="filter-chip" id="collectionChip" data-filter="collection">Collection</button>

      <select id="discoverSortSelect" class="filter-select" aria-label="Sort results">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="alpha_asc">Name: A to Z</option>
        <option value="alpha_desc">Name: Z to A</option>
      </select>

      <button class="clear-filters-btn" id="discoverClearFilters" style="display:none;">Clear Filters</button>
    </div>

  </section>

  <!-- RESULTS -->
  <section class="container">

    <!-- Products Grid -->
    <p class="results-count" id="discoverResultsCount"></p>
    <div class="discover-products-grid" id="discoverProductsGrid"></div>
    <div class="discover-stores-grid" id="discoverStoresGrid" style="display:none;"></div>

    <!-- Loading -->
    <div id="discoverLoading" class="browse-state">
      <div class="spinner"></div>
      <p>Loading marketplace...</p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 HUSTLR. Built for students by KTM Tech. All rights reserved.
  </footer>

  <script type="module" src="discover.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
