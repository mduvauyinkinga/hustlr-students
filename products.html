<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Products - HUSTLR</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your products on HUSTLR.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="my-store.css">
  <link rel="stylesheet" href="products.css">
  <link rel="icon" href="assets/hustlr-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/hustlr-logo.png">
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="brand">
      <picture>
        <source type="image/webp" srcset="assets/hustlr-logo.png">
        <img class="brand-logo" src="assets/hustlr-logo.png" width="34" height="34" alt="Hustlr logo" loading="eager">
      </picture>
      <h1>HUSTLR</h1>
    </div>

    <div>
      <a href="index.html">Home</a>
      <a href="discover.html">Discover</a>
      <a href="browse-stores.html">Browse Stores</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="sellerNavLinks" style="display:none;"></span>
      <a href="create-store.html" id="becomeSellerLink" style="display:none;">Become a Seller</a>
      <a href="safety.html">Safety</a>
      <a href="auth.html" id="authLink">Login</a>
    </div>
  </nav>

  <!-- LOADING STATE -->
  <section class="container products-container" id="loadingState">
    <div class="loading-spinner">
      <div class="spinner-icon"></div>
      <p class="loading-text">Loading products...</p>
    </div>
  </section>

  <!-- PRODUCTS CONTENT (hidden until loaded) -->
  <section class="container products-container" id="productsContent" style="display:none;">

    <div class="products-header">
      <h2>My Products</h2>
      <a href="add-product.html" class="btn add-product-btn">+ Add Product</a>
    </div>

    <p class="subtitle" id="productsSubtitle">Manage your product catalogue.</p>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid">
      <!-- Rendered by JavaScript -->
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 HUSTLR. Built for students by KTM Tech. All rights reserved.
  </footer>

  <script type="module" src="products.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
